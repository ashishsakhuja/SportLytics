services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sportshub
      POSTGRES_PASSWORD: sportshub
      POSTGRES_DB: sportshub
    ports:
      - "5433:5432"
    volumes:
      - sportshub_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sportshub_pg: